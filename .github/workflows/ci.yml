name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Host packages stay uninstalled (see autoInstallPeers in
      # pnpm-workspace.yaml): a profile links the single host copy from the DSH
      # installation anchor, and two copies of a cordis Service class must never
      # exist.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Type-checking needs a host install; the pinned host-matrix job lands with
      # the end-to-end smoke test (a matrix over published host versions).
