name: release

# Publishing goes through npm Trusted Publishing. A trusted relationship exists
# for @clawsjoy/dsh-session-persistence-tolerant (type github, repo
# ClawsJoy/dsh-plugins, file release.yml, permission publish); add one for every
# future package the same way. npm exchanges the OIDC token below for a
# short-lived credential, so no token and no OTP ever lives in the repo, in
# secrets, or on a developer machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      packages:
        description: 'space-separated package directories under packages/'
        required: false
        default: 'session-persistence-tolerant session-retention tool-attribution token-cost'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm: the CLI bundled with Node 22 is
      # too old to exchange the OIDC token.
      - run: npm install -g npm@12
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Building the plugins needs the host types they subclass: the host stays a
      # peer at runtime, but the build must resolve *some* pinned host version.
      # These pins are also the version this release claims compatibility with.
      - name: install pinned host (build-time types)
        run: |
          pnpm add -D -w --config.strict-dep-builds=false \
            @deepseek-ai/cordis@4.0.2 \
            @deepseek-ai/dsh-session@0.1.0-rc.8 \
            @deepseek-ai/dsh-session-persistence@0.1.0-rc.8 \
            @deepseek-ai/dsh-session-persistence-jsonl@0.1.0-rc.8
      - run: pnpm --filter @clawsjoy/dsh-session-persistence-tolerant build
      - run: pnpm --filter @clawsjoy/dsh-session-retention build
      - run: pnpm --filter @clawsjoy/dsh-tool-attribution build
      - run: pnpm --filter @clawsjoy/dsh-token-cost build
      # Idempotent per package: an already-published version is skipped, so a
      # re-run never fails on EPUBLISHCONFLICT and never republishes.
      - name: publish (trusted publishing / provenance)
        env:
          PACKAGES: ${{ github.event.inputs.packages || 'session-persistence-tolerant session-retention' }}
        run: |
          set -e
          for pkg in $PACKAGES; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            echo "publish $name@$version"
            (cd "packages/$pkg" && npm publish --provenance --access public)
          done