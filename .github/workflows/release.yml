name: release

# Publishing goes through npm Trusted Publishing: a trusted relationship for
# @clawsjoy/dsh-session-persistence-tolerant already exists (type github, repo
# ClawsJoy/dsh-plugins, file release.yml, permission publish). npm exchanges the
# OIDC token below for a short-lived credential, so no token and no OTP ever
# lives in the repo, in secrets, or on a developer machine. Verify with:
#   npx npm@12 trust list @clawsjoy/dsh-session-persistence-tolerant
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm: the CLI bundled with Node 22 is
      # too old to exchange the OIDC token.
      - run: npm install -g npm@12
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @clawsjoy/dsh-session-persistence-tolerant build
      - name: publish (trusted publishing / provenance)
        run: |
          cd packages/session-persistence-tolerant
          npm publish --provenance --access public
