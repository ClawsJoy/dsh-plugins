name: release

# Dormant until npm Trusted Publishing is configured for this repository:
# after the first (manually authenticated) publish, add a Trusted Publisher on
# npmjs.com for package @clawsjoy/dsh-session-persistence-tolerant pointing at
# this repo and this workflow file. From then on npm exchanges the OIDC token
# below for a short-lived publish credential, so no token or OTP ever lives in
# the repo, in secrets, or on a developer machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @clawsjoy/dsh-session-persistence-tolerant build
      - name: publish (trusted publishing / provenance)
        run: |
          cd packages/session-persistence-tolerant
          npm publish --provenance --access public
