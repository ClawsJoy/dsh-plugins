packages:
  - 'packages/*'

# Host packages are peers on purpose: a profile links the single copy from the
# DSH installation anchor, and two copies of a cordis Service class must never
# exist. pnpm reads these from the workspace file (the project .npmrc is not the
# source of truth for pnpm settings), and the lockfile records them, so CI's
# frozen install and every 'pnpm run' agree.
autoInstallPeers: false
strictPeerDependencies: false

# The host-matrix job installs a pinned host, whose jsonl backend depends on
# koffi (native). Koffi ships prebuilt binaries and its build script is not
# needed for typechecking or for our tests, so an ignored build script must be a
# warning rather than a failure — otherwise 'pnpm run' refuses to start.
strictDepBuilds: false
